
<div class="channel-player">
  <div class="video-container">
    <video
      #videoElement
      autoplay
      muted
      playsinline
      preload="auto"
      [attr.aria-label]="channelName + ' live stream'">
    </video>

    <app-media-controls
      [media]="videoElement">
    </app-media-controls>

    <div class="live-badge">
      <span class="live-dot"></span>
      LIVE
    </div>
  </div>

  <p class="player-message">{{ message }}</p>
</div>
